<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#155e4b" />
    <meta name="description" content="SadRed - geef spullen een tweede leven." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>SadRed – Geef spullen een tweede leven</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer onerror="window.__sadRadOneSignalError='OneSignal SDK kon niet worden geladen';"></script>
<script>
  window.__sadRadOneSignalError = null;
  window.OneSignalDeferred = window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.init({
        appId: "6107e207-61ab-4eaf-ad12-292c05e7a580",
        serviceWorkerPath: "/sw.js",
        serviceWorkerParam: { scope: "/" }
      });

      window.__sadRadOneSignal = OneSignal;
    } catch (error) {
      window.__sadRadOneSignalError =
        error && error.message ? error.message : String(error);
      console.error("OneSignal init failed:", error);
    }
  });
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
